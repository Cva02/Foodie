spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]

server.port=8080
server.error.include-message=always
spring.application.name=foodie-admin

# Shared MySQL database for Admin and Customer
spring.datasource.url=jdbc:mysql://localhost:3306/foodie_admin?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Siva@02}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# File uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=11MB
foodie.upload.directory=${FOODIE_UPLOAD_DIR:uploads}

# MSG91 OTP settings
foodie.msg91.base-url=${MSG91_BASE_URL:https://control.msg91.com}
foodie.msg91.auth-key=${MSG91_AUTH_KEY:}
foodie.msg91.template-id=${MSG91_TEMPLATE_ID:}
foodie.msg91.otp-length=${MSG91_OTP_LENGTH:6}
foodie.msg91.otp-expiry-minutes=${MSG91_OTP_EXPIRY_MINUTES:5}

# Admin settings
foodie.admin.username=admin
foodie.admin.password=Foodie@2026
foodie.admin.phone=${FOODIE_ADMIN_PHONE:}
foodie.auth.token-hours=12
foodie.seed-demo-data=true

# Customer authentication
foodie.auth.secret=${AUTH_SECRET:change-this-secret-to-a-long-random-string-123456}
foodie.auth.token-days=7

# Customer frontend CORS
foodie.cors.origins=http://localhost:5173

# Demo order lifecycle
foodie.simulation.enabled=false
# foodie.simulation.step-seconds=20,40,60,90
