server.port=8080
server.error.include-message=always

# ---- MySQL (localhost). The database is created automatically on first run. ----
spring.datasource.url=jdbc:mysql://localhost:3306/foodie_customer?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123456789}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Auth ----
foodie.auth.secret=${AUTH_SECRET:change-this-secret-to-a-long-random-string-123456}
foodie.auth.token-days=7

# ---- Demo order lifecycle (seconds between PLACED>CONFIRMED>PREPARING>OUT_FOR_DELIVERY>DELIVERED) ----
foodie.simulation.enabled=false
# //foodie.simulation.step-seconds=20,40,60,90

foodie.cors.origins=http://localhost:5173
